name: Deploy website

# Runs on pushed to the default branch but can also be
# run manually from the GitHub Actions page.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the `GITHUB_TOKEN` to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as
# we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Whether the Standard.site app password is set, without exposing it to
      # any step but the one that publishes.
      STANDARD_PUBLISHING: ${{ secrets.STANDARD_APP_PASSWORD != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Publishes every blog post to Standard.site, then writes each post's
      # record address for the build to link from the post. Records are
      # replaced in place, so publishing on every deploy is safe. It runs once
      # the STANDARD_APP_PASSWORD secret is set, and if it fails (Bluesky down,
      # a revoked password) the site still deploys, keeping the addresses
      # already committed.
      - name: Set up Node for publishing
        if: env.STANDARD_PUBLISHING == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Publish posts to Standard.site
        if: env.STANDARD_PUBLISHING == 'true'
        continue-on-error: true
        run: node scripts/publish-standard-site.mjs
        env:
          STANDARD_HANDLE: alilleybrinker.com
          STANDARD_APP_PASSWORD: ${{ secrets.STANDARD_APP_PASSWORD }}

      - name: Build and upload website
        uses: withastro/action@v6
        env:
          # Lets the projects page read repos from the GitHub API without
          # hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #==========================================================================
  # Deploy the site to GitHub Pages
  #--------------------------------------------------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
