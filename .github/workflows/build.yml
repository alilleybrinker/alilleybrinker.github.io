name: Build website

# Builds every pull request the way the deploy does, so a change that breaks
# the build is caught before it merges rather than when it reaches main.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces a build still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          # Lets the projects page read repos from the GitHub API without
          # hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
