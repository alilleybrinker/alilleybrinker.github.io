name: Build website

# Builds every pull request the way the deploy does, so a change that breaks
# the build is caught before it merges rather than when it reaches main.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces a build still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          # Lets the projects page read repos from the GitHub API without
          # hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Browser checks on the built site: contrast, navigation and title
      # morphs, previews, the command palette, posts' table of contents, code
      # and reading progress, layout on phones, and no long main-thread tasks
      # (tests/).
      - name: Install a browser for the checks
        run: npx playwright install --with-deps chromium

      - name: Check the site in a browser
        run: npm test

      - name: Keep traces of failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-traces
          path: test-results/
          retention-days: 7
