name: Check links

# Once a week, checks the links from the site to other sites and writes a
# report of any that no longer work on the run's summary page, under Actions.
# Broken links don't fail the run, and it never blocks a deploy. It can also
# be run by hand from the GitHub Actions page.
on:
  schedule:
    - cron: "41 15 * * 1"
  workflow_dispatch:

# Nothing by default; the job asks for only what it needs.
permissions: {}

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          # Lets the projects page read repos from the GitHub API without
          # hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check links to other sites
        id: check
        run: echo "broken=$(node scripts/check-links.mjs dist links-report.md)" >> "$GITHUB_OUTPUT"

      - name: Report on the run's summary page
        env:
          BROKEN: ${{ steps.check.outputs.broken }}
        run: |
          {
            echo "# Links to other sites"
            echo
            cat links-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat links-report.md
